# Example module manifest — com.valtoryn.compute.jetson_orin
# Compute module declaration. Note: Jetson Orin Nano currently ships JetPack 7.2
# on Ubuntu 24.04, which conflicts with Lyrical's Ubuntu 26.04 base — see
# docs/engineering/DECISION_GATES.md G-A. The ros_distro_target parameter in the
# robot config records the intended target pending that decision.

manifest_schema_version: "1.0.0"
module_type: "com.valtoryn.compute.jetson_orin"
module_version: "1.0.0"

provides:
  - kind: "network"
    name: "robot_interior_network"
  - kind: "ros_topic"
    name: "/diagnostics"
    version_range: "^1.0"

requires:
  - kind: "mechanical"
    name: "compute_tray"
  - kind: "electrical"
    name: "12V_power_bus"

frames:
  declared: []
  mounts:
    - mount_type: "compute_tray"
      occupied_mounts: ["compute_bay_1"]

hardware_identity:
  vendor: "nvidia"
  product: "jetson_orin_nano"
  firmware_range: ">=7.0 <8.0"

platform:
  ros_distro: "jazzy"
  rmw: "rmw_fastrtps_cpp"
  dependencies: []

verification:
  verified_by: "none"
  verification_method: "none"
  capabilities:
    declared:
      - "compute_host"
      - "ros2_runtime"
    verified: []

safety:
  evidence_ids: []
  claim: "none"
