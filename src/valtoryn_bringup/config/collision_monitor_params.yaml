# Collision Monitor configuration for Valtoryn reference AMR
# Uses navigation LiDAR (/scan) exclusively for collision avoidance.
# NOTE: This software function is NOT a certified functional safety function.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "/diff_drive_controller/cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0

    polygons: ["PolygonSlowdown", "PolygonStop"]

    PolygonSlowdown:
      type: "polygon"
      points: [0.65, 0.45, 0.65, -0.45, -0.45, -0.45, -0.45, 0.45]
      action_type: "slowdown"
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: "polygon_slowdown"

    PolygonStop:
      type: "polygon"
      points: [0.50, 0.35, 0.50, -0.35, -0.40, -0.35, -0.40, 0.35]
      action_type: "stop"
      visualize: true
      polygon_pub_topic: "polygon_stop"

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"

