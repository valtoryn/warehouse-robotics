# Collision Monitor configuration for Valtoryn reference AMR
# Uses navigation LiDAR (/scan) exclusively for collision avoidance.
# NOTE: This software function is NOT a certified functional safety function.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "/diff_drive_controller/cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0

    # Polygons empty: collision_monitor runs as a transparent pass-through bridge
    # from cmd_vel_nav (from velocity smoother) to /diff_drive_controller/cmd_vel.
    # Obstacle avoidance and deceleration are handled by Nav2 costmaps and FollowPath.
    polygons: []


    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"

