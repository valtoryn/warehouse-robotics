name: checks-and-ros-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-and-unit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install config-validator dependencies
        run: pip install pyyaml jsonschema

      - name: Documentation checks
        run: python tools/check_docs.py

      - name: Robot config and manifest checks
        run: python tools/check_config.py

      - name: ROS interface and BT XML static checks
        run: python tools/check_interfaces.py

      - name: URDF generation smoke test
        run: python tools/gen_urdf.py config/robots/ref-amr-diff-v1.yaml --backend mock --out /tmp/ref-amr.urdf

      - name: Launch/params generation smoke test
        run: python tools/gen_launch.py config/robots/ref-amr-diff-v1.yaml --out-dir /tmp/gen

      - name: Differential kinematics simulation test
        run: python tools/simulate_kinematics.py config/robots/ref-amr-diff-v1.yaml

      - name: Offline unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  ros-jazzy-build-and-test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          for i in 1 2 3; do apt-get update && break || sleep 5; done
          apt-get install -y --no-install-recommends \
            python3-pip \
            python3-colcon-common-extensions \
            python3-yaml \
            python3-jsonschema \
            ros-jazzy-ros2-control \
            ros-jazzy-ros2-controllers \
            ros-jazzy-behaviortree-cpp \
            ros-jazzy-nav2-msgs

      - name: Execute ROS 2 Jazzy integration spike and motion verification
        run: |
          . /opt/ros/jazzy/setup.sh
          python3 tools/run_spike.py

  gazebo-harmonic-nav2-simulation:
    needs: [ros-jazzy-build-and-test]
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install Gazebo Harmonic, Nav2, and ROS dependencies
        run: |
          for i in 1 2 3; do apt-get update && break || sleep 5; done
          apt-get install -y --no-install-recommends \
            python3-pip \
            python3-colcon-common-extensions \
            python3-yaml \
            python3-jsonschema \
            ros-jazzy-ros2-control \
            ros-jazzy-ros2-controllers \
            ros-jazzy-behaviortree-cpp \
            ros-jazzy-nav2-msgs \
            ros-jazzy-navigation2 \
            ros-jazzy-nav2-bringup \
            ros-jazzy-slam-toolbox \
            ros-jazzy-ros-gz \
            ros-jazzy-gz-ros2-control

      - name: Build workspace with colcon
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --event-handlers console_direct+

      - name: Run Gazebo Harmonic & Nav2 scenario verification suite
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          python3 tools/run_scenarios.py --runs 3

      - name: Archive simulation scenario results and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-scenario-artifacts
          path: |
            generated/scenario_report.json
            generated/scenario_metrics.json
            generated/warehouse_sim.log
            generated/ref-amr-diff-v1_gazebo.urdf
